services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kknhub_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "KKNHub"
      APP_ENV: "local"
      APP_KEY: "base64:TO7sW0+9SxEWFpcI5hdjLQ9QL3cq+7Vi4gsYLWsTwQg="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "kknhub_db"
      DB_USERNAME: "kknhub_user"
      DB_PASSWORD: "kknhub_password"
      FILESYSTEM_DISK: "s3"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_BUCKET: "kknhub-documents"
      AWS_ENDPOINT: "http://minio:9000"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      - mysql
      - minio
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  mysql:
    image: mysql:8.0
    container_name: kknhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root_password"
      MYSQL_DATABASE: "kknhub_db"
      MYSQL_USER: "kknhub_user"
      MYSQL_PASSWORD: "kknhub_password"
    ports:
      - "3306:3306"
    volumes:
      - kknhub_mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: kknhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kknhub_minio_data:/data

volumes:
  kknhub_mysql_data:
  kknhub_minio_data:
